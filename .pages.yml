# Админка Pages CMS (https://app.pagescms.org) для сайта «Бешеные ракетки».
#
# Меню повторяет сайт: «Общее» — то, что используется везде, «Блоки сайта» — по пункту
# на каждый блок страницы, сверху вниз. Телефон и список соцсетей заполняются один раз
# в «Общем»; в блоках соцсети выбираются из этого списка.
# Площадка, вид тренировки и уровни в расписании выбираются из списка — это записи
# из «Где играем», «Наших тренировок» и «Уровней игроков» (файлы в content/<папка>/).
#
# name — ключ в файлах content/, его не менять (см. tools/build-content.mjs).
# label — подпись для админа.

media:
  input: site/media
  output: media
  categories: [image]
  rename: safe

components:
  show:
    label: Показывать на сайте
    type: boolean
    default: true
  order:
    label: Порядок
    type: number
    description: Меньше — выше
  rich:
    type: rich-text
    options:
      media: false
  # Карточка акции или турнира — поля одинаковые
  card:
    type: object
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: when
        label: Когда
        type: string
      - name: venue
        label: Площадка
        type: reference
        options:
          collection: venues
          value: "{name}"
          label: "{title}"
          search: title
      - name: place
        label: Другое место
        type: string
        description: Если его нет в «Где играем»
      - name: text
        label: Текст
        component: rich
      - name: image
        label: Картинка
        type: image
      - name: button_label
        label: Текст кнопки
        type: string
        description: Пусто — без кнопки
      - name: button_link
        label: Своя ссылка кнопки
        type: string
        description: Пусто — откроется окно «Записаться»
      - name: until
        label: Показывать до
        type: date
        default: ""
        description: Пусто — всегда
      - name: show
        component: show

content:
  - name: common
    label: Общее
    type: group
    items:
      - name: general
        label: Телефон
        type: file
        path: content/general.json
        format: json
        fields:
          - name: phone
            label: Номер телефона
            type: string
            description: В шапке, в окне «Записаться», в блоке «Приходи играть» и вместо {телефон} в текстах

      - name: networks
        label: Соцсети
        description: Все соцсети и мессенджеры клуба. Где какие показывать — выбирается в блоках.
        type: collection
        path: content/networks
        format: json
        filename:
          template: "{primary}.json"
          field: false
        view:
          primary: title
          fields: [title, link]
          sort: [title]
          default:
            sort: title
            order: asc
        fields:
          - name: title
            label: Название
            type: string
            required: true
            description: Так подписывается на сайте, например Telegram
          - name: link
            label: Ссылка
            type: string
            required: true

      - name: levels
        label: Уровни игроков
        type: collection
        path: content/levels
        format: json
        filename:
          template: "{primary}.json"
          field: false
        view:
          primary: title
          fields: [title, description, order]
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Уровень
            type: string
            required: true
          - name: description
            label: Описание
            type: string
            description: Подсказка в расписании и строка в списке {уровни}
          - name: order
            label: Порядок
            type: number
            description: От новичков к сильным

  - name: page
    label: Блоки сайта
    type: group
    items:
      - name: hero
        label: Главный экран
        type: file
        path: content/hero.json
        format: json
        fields:
          - name: heading
            label: Главный заголовок
            type: string
            required: true
            description: Самая крупная надпись на сайте — по ней поисковики понимают, о чём сайт. Пишите так, как ищут, например «Бадминтон в Саратове»
          - name: title
            label: Название клуба
            type: string
            required: true
            description: На салатовой плашке под главным заголовком — «Клуб «…»»
          - name: slogan
            label: Надпись над заголовком
            type: string
            description: Мелкая строка над главным заголовком, например слоган или текущая акция. Пусто — строки нет
          - name: text
            label: Текст
            type: text

      - name: strip
        label: Лента фото
        type: file
        path: content/strip.json
        format: json
        fields:
          - name: show
            component: show
          - name: photos
            label: Ещё фото в ленту
            type: image
            description: Лента под первым экраном собирается сама из фото площадок (все, кроме первого — общего) и каждый раз перемешивается. Здесь — дополнительные кадры, которые не про конкретный зал (турниры, праздники). Можно загружать как есть — сайт сам их сожмёт
            options:
              multiple: true
              unique: true
              path: site/media
              extensions: [jpg, jpeg, png, webp]

      - name: training_types
        label: Наши тренировки
        type: collection
        path: content/training-types
        format: json
        filename:
          template: "{primary}.json"
          field: false
        view:
          primary: title
          fields: [title, color, order, show]
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Название
            type: string
            required: true
          - name: description
            label: Описание
            component: rich
          - name: photo
            label: Фото
            type: image
            description: Что происходит на этой тренировке — горизонтальное фото. Можно загружать как есть — сайт сам его сожмёт
            options:
              path: site/media/trainings
              extensions: [jpg, jpeg, png, webp]
          - name: color
            label: Цвет карточки в расписании
            type: select
            description: Карточки разных видов тренировок в расписании — разного цвета. Этим же цветом — полоска под фото в карточке «Наших тренировок»
            options:
              values:
                - value: lime
                  label: Салатовый
                - value: white
                  label: Белый
                - value: blue
                  label: Голубой
                - value: gray
                  label: Серый
                - value: dark
                  label: Тёмный
          - name: hide_levels
            label: Без уровней в расписании
            type: boolean
            default: false
            description: Для персональных — там уровень не важен, плашка «все уровни» не нужна
          - name: coaches_link
            label: Ссылка «Написать тренеру»
            type: boolean
            default: false
            description: Ведёт к блоку «Тренеры»; если он скрыт, ссылки не будет
          - name: order
            component: order
          - name: show
            component: show

      - name: schedule
        label: Расписание
        type: file
        path: content/schedule.json
        format: json
        fields:
          - name: items
            label: Тренировки по неделе
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{day}, {time}"
            fields:
              - name: day
                label: День
                type: select
                required: true
                options:
                  values: [Понедельник, Вторник, Среда, Четверг, Пятница, Суббота, Воскресенье]
              - name: time
                label: Время
                type: string
                required: true
                pattern:
                  regex: "^\\s*\\d{1,2}:\\d{2}\\s*[–—-]\\s*\\d{1,2}:\\d{2}\\s*$"
                  message: "Например 20:30–22:00"
              - name: type
                label: Тренировка
                type: reference
                required: true
                options:
                  collection: training_types
                  value: "{name}"
                  label: "{title}"
                  search: title
              - name: venue
                label: Площадка
                type: reference
                description: Можно не указывать (например, у персональных) — тогда на карточке её не будет
                options:
                  collection: venues
                  value: "{name}"
                  label: "{title}"
                  search: title
              - name: levels
                label: Уровни
                type: reference
                description: Пусто — «все уровни»
                options:
                  collection: levels
                  multiple: true
                  value: "{name}"
                  label: "{title}"
                  search: title
              - name: price
                label: Цена, ₽
                type: number
                description: Пусто — цена площадки, 0 — цену не показывать
              - name: slot_minutes
                label: Занятия по, мин
                type: number
                description: Например 60 — строка 18:00–22:00 станет четырьмя карточками 18:00–19:00, 19:00–20:00… (для персональных). Пусто — одна карточка
              - name: show
                component: show
          - name: cancellations
            label: Отмены
            description: Если в какой-то день тренировки не будет (праздник, зал занят) — на сайте она будет зачёркнута с причиной. Прошедшие отмены можно не удалять — сайт их не покажет
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date} {time} {reason}"
            fields:
              - name: date
                label: Дата
                type: date
                required: true
              - name: time
                label: Время начала
                type: string
                description: Например 20:30. Пусто — отменено всё в этот день
              - name: reason
                label: Причина
                type: string
                description: Коротко — «праздник», «зал занят»

      - name: signup
        label: Запись (под расписанием)
        type: file
        path: content/signup.json
        format: json
        fields:
          - name: show
            label: Показывать запись
            type: boolean
            default: true
          - name: steps
            label: Шаги
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {title}"
            fields:
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: text
                label: Текст
                component: rich
          - name: button_label
            label: Текст кнопки записи
            type: string
            description: Под расписанием, на первом экране и на плавающей кнопке на телефоне
          - name: sheet
            label: Окно «Записаться»
            description: Открывается всеми кнопками «Записаться» на сайте
            type: object
            fields:
              - name: title
                label: Заголовок
                type: string
              - name: text
                label: Текст
                type: string
              - name: networks
                label: Соцсети в окне
                type: reference
                description: В выбранном порядке, первая — главная (салатовая) кнопка
                options:
                  collection: networks
                  multiple: true
                  value: "{name}"
                  label: "{title}"
                  search: title
              - name: network_label
                label: Подпись кнопок соцсетей
                type: string
                description: "{сеть} заменится на название: «Написать в {сеть}» → «Написать в Telegram»"
              - name: phone
                label: Показывать телефон
                type: boolean
                default: true
              - name: phone_label
                label: Кнопка телефона
                type: string
                description: Номер добавится после текста

      - name: venues
        label: Где играем
        type: collection
        path: content/venues
        format: json
        filename:
          template: "{primary}.json"
          field: false
        view:
          primary: title
          fields: [title, price, order, show]
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Короткое название
            type: string
            required: true
          - name: full_name
            label: Полное название
            type: string
          - name: address
            label: Адрес
            type: string
          - name: price
            label: Цена тренировки, ₽
            type: number
          - name: point
            label: Точка на карте
            type: string
            description: "Широта и долгота через запятую, например 51.531542, 45.983106. Где взять: в Яндекс Картах нажми на здание — координаты будут в карточке места. Пусто — карты рядом с фото не будет"
          - name: map_link
            label: Своя ссылка на карту
            type: string
            description: Пусто — Яндекс Карты по точке или по адресу
          - name: photos
            label: Фото
            type: image
            description: Первое — большое в сетке (например, общее фото), в ленту наверху оно не попадает. Остальные — в сетке и в ленте, лишние открываются по нажатию на «+N». Можно загружать как есть — сайт сам их сожмёт
            options:
              multiple: true
              unique: true
              path: site/media/venues
              extensions: [jpg, jpeg, png, webp]
          - name: order
            component: order
          - name: show
            component: show

      - name: coaches
        label: Тренеры
        type: collection
        path: content/coaches
        format: json
        filename:
          template: "{primary}.json"
          field: false
        view:
          primary: title
          fields: [title, order, show]
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Имя
            type: string
            required: true
          - name: photo
            label: Фото
            type: image
          - name: about
            label: О себе
            component: rich
          - name: telegram
            label: Telegram
            type: string
          - name: order
            component: order
          - name: show
            component: show

      - name: promos
        label: Акции
        type: file
        path: content/promos.json
        format: json
        fields:
          - name: items
            label: false
            component: card
            list:
              collapsible:
                collapsed: true
                summary: "{title}"

      - name: tournaments
        label: Турниры
        type: file
        path: content/tournaments.json
        format: json
        fields:
          - name: items
            label: false
            component: card
            list:
              collapsible:
                collapsed: true
                summary: "{title}"

      - name: partners
        label: Партнёры
        type: file
        path: content/partners.json
        format: json
        fields:
          - name: items
            label: false
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Название
                type: string
                required: true
              - name: description
                label: Описание
                component: rich
              - name: logo
                label: Логотип
                type: image
              - name: link
                label: Ссылка
                type: string
                description: Сайт или соцсеть партнёра — в карточке появится ссылка
              - name: link_label
                label: Текст ссылки
                type: string
                description: Если пусто — адрес сайта, например «badm-store.ru»
              - name: show
                component: show

      - name: faq
        label: Частые вопросы
        type: file
        path: content/faq.json
        format: json
        fields:
          - name: items
            label: false
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{question}"
            fields:
              - name: question
                label: Вопрос
                type: string
                required: true
              - name: answer
                label: Ответ
                component: rich
                description: "Подстановки: {телефон}, {уровни} и любая соцсеть по названию, например {Telegram}"
              - name: show
                component: show

      - name: final
        label: Приходи играть
        type: file
        path: content/final.json
        format: json
        fields:
          - name: title
            label: Заголовок блока
            type: string
          - name: text
            label: Текст под заголовком
            type: string
            description: Под ним — кнопка с номером телефона
          - name: groups_text
            label: Текст над кнопками групп
            type: string
          - name: group_networks
            label: Кнопки групп
            type: reference
            description: Какие соцсети показать большими кнопками, в выбранном порядке
            options:
              collection: networks
              multiple: true
              value: "{name}"
              label: "{title}"
              search: title
          - name: group_label
            label: Подпись кнопок групп
            type: string
            description: "{сеть} заменится на название: «Группа в {сеть}» → «Группа в Telegram»"
          - name: links
            label: Ссылки на соцсети в самом низу
            type: reference
            description: Какие соцсети показать строкой ссылок под кнопками
            options:
              collection: networks
              multiple: true
              value: "{name}"
              label: "{title}"
              search: title
          - name: about
            label: О клубе
            component: rich
            description: Пара абзацев о клубе внизу блока — обычными словами, как ищут («бадминтон в Саратове», площадки, для кого). Пусто — не показывается
