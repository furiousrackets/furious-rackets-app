# Админка Pages CMS (https://app.pagescms.org) для сайта «Бешеные ракетки».
#
# Меню повторяет сайт: «Общее» — то, что используется везде, «Блоки сайта» — по пункту
# на каждый блок страницы, сверху вниз. Контакты и соцсети заполняются один раз в «Общем»;
# в блоке свой контакт указывают, только если он отличается (пусто = общий).
# Площадка, вид тренировки и уровни в расписании выбираются из списка — это записи
# из «Где играем», «Наших тренировок» и «Уровней игроков» (файлы в content/<папка>/).
#
# name — ключ в файлах content/, его не менять (см. tools/build-content.mjs).
# label — подпись для админа.

media:
  input: site/media
  output: media
  categories: [image]
  rename: safe

components:
  show:
    label: Показывать на сайте
    type: boolean
    default: true
  order:
    label: Порядок
    type: number
    description: Меньше — выше
  rich:
    type: rich-text
    options:
      media: false
  # Карточка акции или турнира — поля одинаковые
  card:
    type: object
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: when
        label: Когда
        type: string
      - name: venue
        label: Площадка
        type: reference
        options:
          collection: venues
          value: "{name}"
          label: "{title}"
          search: title
      - name: place
        label: Другое место
        type: string
        description: Если его нет в «Где играем»
      - name: text
        label: Текст
        component: rich
      - name: image
        label: Картинка
        type: image
      - name: button_label
        label: Текст кнопки
        type: string
        description: Пусто — без кнопки
      - name: button_link
        label: Своя ссылка кнопки
        type: string
        description: Пусто — откроется окно «Записаться»
      - name: until
        label: Показывать до
        type: date
        default: ""
        description: Пусто — всегда
      - name: show
        component: show

content:
  - name: common
    label: Общее
    type: group
    items:
      - name: general
        label: Контакты и соцсети
        type: file
        path: content/general.json
        format: json
        fields:
          - name: phone
            label: Телефон
            type: string
          - name: networks
            label: Соцсети и мессенджеры
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Название
                type: string
                required: true
              - name: link
                label: Ссылка
                type: string
                required: true
              - name: main
                label: Главная
                type: boolean
                default: false
                description: Одна на сайт — первая в окне «Записаться» и в {группа}
              - name: signup
                label: Для записи
                type: boolean
                default: false
                description: Показывать в окне «Записаться» и кнопкой внизу страницы. Без отметки — просто ссылка в самом низу.

      - name: levels
        label: Уровни игроков
        type: collection
        path: content/levels
        format: json
        filename:
          template: "{primary}.json"
          field: false
        view:
          primary: title
          fields: [title, description, order]
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Уровень
            type: string
            required: true
          - name: description
            label: Описание
            type: string
            description: Подсказка в расписании и строка в списке {уровни}
          - name: order
            label: Порядок
            type: number
            description: От новичков к сильным

  - name: page
    label: Блоки сайта
    type: group
    items:
      - name: hero
        label: Главный экран
        type: file
        path: content/hero.json
        format: json
        fields:
          - name: title
            label: Заголовок
            type: string
            required: true
          - name: slogan
            label: Слоган
            type: string
          - name: text
            label: Текст
            type: text

      - name: training_types
        label: Наши тренировки
        type: collection
        path: content/training-types
        format: json
        filename:
          template: "{primary}.json"
          field: false
        view:
          primary: title
          fields: [title, highlight, order, show]
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Название
            type: string
            required: true
          - name: description
            label: Описание
            component: rich
          - name: highlight
            label: Выделять в расписании
            type: boolean
            default: false
          - name: coaches_link
            label: Ссылка «Написать тренеру»
            type: boolean
            default: false
            description: Ведёт к блоку «Тренеры»; если он скрыт, ссылки не будет
          - name: order
            component: order
          - name: show
            component: show

      - name: schedule
        label: Расписание
        type: file
        path: content/schedule.json
        format: json
        fields:
          - name: items
            label: false
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{day}, {time}"
            fields:
              - name: day
                label: День
                type: select
                required: true
                options:
                  values: [Понедельник, Вторник, Среда, Четверг, Пятница, Суббота, Воскресенье]
              - name: time
                label: Время
                type: string
                required: true
                pattern:
                  regex: "^\\s*\\d{1,2}:\\d{2}\\s*[–—-]\\s*\\d{1,2}:\\d{2}\\s*$"
                  message: "Например 20:30–22:00"
              - name: type
                label: Тренировка
                type: reference
                required: true
                options:
                  collection: training_types
                  value: "{name}"
                  label: "{title}"
                  search: title
              - name: venue
                label: Площадка
                type: reference
                required: true
                options:
                  collection: venues
                  value: "{name}"
                  label: "{title}"
                  search: title
              - name: levels
                label: Уровни
                type: reference
                description: Пусто — «все уровни»
                options:
                  collection: levels
                  multiple: true
                  value: "{name}"
                  label: "{title}"
                  search: title
              - name: price
                label: Цена, ₽
                type: number
                description: Пусто — цена площадки
              - name: show
                component: show

      - name: signup
        label: Как записаться
        type: file
        path: content/signup.json
        format: json
        fields:
          - name: show
            label: Показывать блок
            type: boolean
            default: true
          - name: title
            label: Заголовок
            type: string
            required: true
          - name: steps
            label: Шаги
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {title}"
            fields:
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: text
                label: Текст
                component: rich
          - name: button_label
            label: Текст кнопки записи
            type: string
            description: На первом экране, под шагами и на плавающей кнопке на телефоне
          - name: sheet
            label: Окно «Записаться»
            description: Открывается всеми кнопками «Записаться» на сайте
            type: object
            fields:
              - name: title
                label: Заголовок
                type: string
              - name: text
                label: Текст
                type: string
              - name: network_label
                label: Кнопки сетей
                type: string
                description: "{сеть} заменится на название: «Написать в {сеть}» → «Написать в Telegram». Какие сети — отметка «Для записи» в «Контактах и соцсетях»."
              - name: phone
                label: Показывать телефон
                type: boolean
                default: true
              - name: phone_label
                label: Кнопка телефона
                type: string
                description: Номер добавится после текста

      - name: venues
        label: Где играем
        type: collection
        path: content/venues
        format: json
        filename:
          template: "{primary}.json"
          field: false
        view:
          primary: title
          fields: [title, price, order, show]
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Короткое название
            type: string
            required: true
          - name: full_name
            label: Полное название
            type: string
          - name: address
            label: Адрес
            type: string
          - name: price
            label: Цена тренировки, ₽
            type: number
          - name: map_link
            label: Своя ссылка на карту
            type: string
            description: Пусто — Яндекс Карты по адресу
          - name: order
            component: order
          - name: show
            component: show

      - name: coaches
        label: Тренеры
        type: collection
        path: content/coaches
        format: json
        filename:
          template: "{primary}.json"
          field: false
        view:
          primary: title
          fields: [title, order, show]
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Имя
            type: string
            required: true
          - name: photo
            label: Фото
            type: image
          - name: about
            label: О себе
            component: rich
          - name: telegram
            label: Telegram
            type: string
          - name: order
            component: order
          - name: show
            component: show

      - name: promos
        label: Акции
        type: file
        path: content/promos.json
        format: json
        fields:
          - name: items
            label: false
            component: card
            list:
              collapsible:
                collapsed: true
                summary: "{title}"

      - name: tournaments
        label: Турниры
        type: file
        path: content/tournaments.json
        format: json
        fields:
          - name: items
            label: false
            component: card
            list:
              collapsible:
                collapsed: true
                summary: "{title}"

      - name: partners
        label: Партнёры
        type: file
        path: content/partners.json
        format: json
        fields:
          - name: items
            label: false
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Название
                type: string
                required: true
              - name: description
                label: Описание
                type: string
              - name: logo
                label: Логотип
                type: image
              - name: link
                label: Ссылка
                type: string
              - name: show
                component: show

      - name: faq
        label: Частые вопросы
        type: file
        path: content/faq.json
        format: json
        fields:
          - name: items
            label: false
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{question}"
            fields:
              - name: question
                label: Вопрос
                type: string
                required: true
              - name: answer
                label: Ответ
                component: rich
                description: "Подстановки: {телефон}, {группа}, {Telegram}, {MAX}, {уровни}"
              - name: show
                component: show

      - name: final
        label: Приходи играть
        type: file
        path: content/final.json
        format: json
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: text
            label: Текст
            type: string
          - name: groups_text
            label: Текст над кнопками
            type: string
